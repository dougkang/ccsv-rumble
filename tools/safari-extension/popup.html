<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Roster Capture</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    margin: 0; padding: 14px; width: 310px;
  }
  h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: .02em; text-transform: uppercase;
       opacity: .6; font-weight: 600; }
  .count { font-size: 30px; font-weight: 600; line-height: 1; margin-bottom: 2px;
           font-variant-numeric: tabular-nums; }
  .count small { font-size: 15px; font-weight: 400; opacity: .5; }
  .bar { height: 5px; border-radius: 3px; background: color-mix(in srgb, currentColor 14%, transparent);
         overflow: hidden; margin: 10px 0 12px; }
  .bar > span { display: block; height: 100%; background: #2d8a4e; transition: width .2s; }
  button {
    font: inherit; width: 100%; padding: 7px 10px; margin-bottom: 7px; border-radius: 7px;
    border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
    background: color-mix(in srgb, currentColor 7%, transparent); color: inherit; cursor: pointer;
  }
  button:hover:not(:disabled) { background: color-mix(in srgb, currentColor 13%, transparent); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #2d8a4e; border-color: #2d8a4e; color: #fff; font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #26743f; }
  .msg { margin-top: 8px; padding: 7px 9px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; }
  .msg.ok   { background: color-mix(in srgb, #2d8a4e 16%, transparent); }
  .msg.warn { background: color-mix(in srgb, #b8860b 20%, transparent); }
  .msg.err  { background: color-mix(in srgb, #c0392b 18%, transparent); }
  .missing { font-size: 11px; opacity: .65; margin-top: 8px; line-height: 1.5;
             font-variant-numeric: tabular-nums; }
  .row { display: flex; gap: 7px; }
  .row button { margin-bottom: 0; }
</style>
</head>
<body>
  <h1>Roster capture</h1>
  <div class="count"><span id="n">0</span><small> / 18 teams</small></div>
  <div class="bar"><span id="bar" style="width:0%"></span></div>

  <button id="grab" class="primary">Capture this team</button>
  <div class="row">
    <button id="save">Download CSV</button>
    <button id="reset">Reset</button>
  </div>

  <div id="msg" class="msg" hidden></div>
  <div id="missing" class="missing"></div>

  <script src="popup.js"></script>
</body>
</html>
